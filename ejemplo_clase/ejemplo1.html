<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 1</title>
    <style>
        div{
            width: 200px;
            height: 200px;
            background-color: bisque;
            border: 3px solid red;
            z-index: 3;
        }

        #desplazado{
            position: absolute;
            left: 50px;
            top: 50px;
            background-color: aqua;
            z-index: -1;
        }

        #contenedor{
            width: 400px;
            height: 400px;
            border: 3px solid blueviolet;
            background-color: aliceblue;
            margin: auto;
            position: relative;
        }
    </style>
</head>
<body>
        <div id="contenedor">
            <div>Bloque 1</div>
            <div id="desplazado">Bloque 2</div>
            <div>Bloque 3</div>
        </div>
    </body>
</html>
