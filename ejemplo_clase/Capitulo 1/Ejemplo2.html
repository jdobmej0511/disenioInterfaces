<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    h1 {
        font-size: 4em;
        font-family: "Roboto", sans-serif;
        font-style: normal;
        padding: 30px;
        text-align: center;
        margin: 50px;
        /* background: linear-gradient(90deg, rgba(42, 123, 155, 1) 0%, rgba(87, 199, 133, 1) 50%, rgba(237, 221, 83, 1) 100%); */
        background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTcBX0TEfmp2NmhjE97o_oprjsgfM9s9E4udNFCSSbBUA&s=10");
        background-clip: text;
        color: white;
        -webkit-text-stroke: 14px transparent;
    }

    .galeria{
        width: 100vw;
        height: 300px;
        text-align: center;
        align-content: center;
        background-color: black;
    }

    .galeria img{
        width: 250px;
        border-radius: 10px;
        margin: 5px;
        filter: grayscale(0.1) brightness(1.5) saturate(1.3) blur(3px);
        transition: 0.2s all;
    }
    .galeria img:hover{
        filter: grayscale(0.1) brightness(1) saturate(1) blur(1px);
        width: 260px;

    }

    #imgSombra{
        width: 400px;
        margin: 30px;
        /* box-shadow: 2px 2px 2px #000; */
        filter: drop-shadow(2px 2px 2px #000)
    }

    #contenedor{
        width: 100vw;
        height: 600px;
        background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTu0G2b7VsgsNgp-B-uiyJYxNbvQxMF42-yGn9k36HAzQ&s=10");
        background-size: cover;
        text-align: center;
        align-content: center;
    }

    #contenido{
        font-family: "Roboto", sans-serif;
        font-style: normal;
        font-size: 3rem;
        width: 450px;
        height: 300px;
        padding: 100px;
        font-size: 3rem;
        margin: 200px auto;
        text-align: center;
        align-content: center;
        color: black;
        background-color: (255 255 255 / 0.5);
        backdrop-filter: blur(8px);
        border-radius: 20px;
    }
</style>
<body>
    <h1>Un cafesito riquito riquito</h1>
    <div class="galeria">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTcBX0TEfmp2NmhjE97o_oprjsgfM9s9E4udNFCSSbBUA&s=10" alt="">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTcBX0TEfmp2NmhjE97o_oprjsgfM9s9E4udNFCSSbBUA&s=10" alt="">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTcBX0TEfmp2NmhjE97o_oprjsgfM9s9E4udNFCSSbBUA&s=10" alt="">
    </div>

    <img id="imgSombra" src="/ejemplo_clase/Capitulo 1/img/mortadela-removebg-preview.png">

    <div id="contenedor">
        <div id="contenido">Charcuteria Pacome</div>
    </div>
</body>
</html>
